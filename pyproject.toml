[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi150-gpu-grpc-detector"
dynamic = ["version"]
description = "Standalone YOLOv5 gRPC inference service for Iluvatar BI-V150/CoreX"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "bi150-detector-contract==0.1.0",
  "grpcio-health-checking==1.83.1",
  "matplotlib==3.10.9",
  "opencv-python-headless==4.11.0.86",
  "prometheus-client==0.24.1",
  "seaborn==0.13.2",
]

[project.scripts]
gpu-detector = "gpu_detector.main:main"
gpu-detector-client = "gpu_detector.client:main"
gpu-detector-continuous-client = "gpu_detector.continuous_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
